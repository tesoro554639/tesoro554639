<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Wave 1 Gradient (Deep Electric Blue to Indigo) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.5" />
    </linearGradient>

    <!-- Wave 2 Gradient (Neon Cyan to Sky Blue) -->
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="12" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="340" fill="url(#grid)" rx="12" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#00D2FF" opacity="0.08" filter="url(#cyanGlow)" />
  <circle cx="1000" cy="180" r="160" fill="#6366F1" opacity="0.09" filter="url(#cyanGlow)" />
  <circle cx="600" cy="40" r="100" fill="#38BDF8" opacity="0.06" filter="url(#cyanGlow)" />

  <!-- Dynamic Wave Layer 1 (Static coordinates guarantee 100% render reliability) -->
  <path d="M 0 210 Q 280 150 600 220 T 1200 180 L 1200 340 L 0 340 Z" fill="url(#waveGrad1)" />

  <!-- Dynamic Wave Layer 2 -->
  <path d="M 0 250 Q 320 280 600 230 T 1200 240 L 1200 340 L 0 340 Z" fill="url(#waveGrad2)" opacity="0.75" />

  <!-- Deep Base Footer Wave -->
  <path d="M 0 280 Q 300 250 650 285 T 1200 270 L 1200 340 L 0 340 Z" fill="#07090E" opacity="0.9" />

  <!-- Top Accent Glowing Cyber Line -->
  <line x1="100" y1="2" x2="1100" y2="2" stroke="url(#waveGrad2)" stroke-width="2.5" opacity="0.8" filter="url(#subtleGlow)" />

  <!-- Terminal / Status Pill -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0F172A" stroke="#00D2FF" stroke-width="1.2" opacity="0.95" />
    <circle cx="-115" cy="0" r="4.5" fill="#00D2FF" filter="url(#cyanGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="5" text-anchor="middle" fill="#00D2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.5">
      LEVELING UP  •  SYSTEM ACTIVE
    </text>
  </g>

  <!-- Main Name Header -->
  <text x="600" y="132" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="48" font-weight="900" letter-spacing="3" filter="url(#cyanGlow)">
    LUIS JAMES TESORO
  </text>

  <!-- Subtitle with Glowing Accent -->
  <text x="600" y="174" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="2">
    SOFTWARE ENGINEER <tspan fill="#00D2FF"> | </tspan> FULL-STACK &amp; MOBILE ARCHITECT
  </text>

  <!-- Tech Badges / Keywords Row -->
  <g transform="translate(600, 206)">
    <text x="0" y="0" text-anchor="middle" fill="#38BDF8" font-family="'Fira Code', monospace, Consolas, sans-serif" font-size="13" font-weight="500" letter-spacing="2" opacity="0.9">
      FLUTTER  •  DART  •  TYPESCRIPT  •  SUPABASE  •  POSTGRESQL  •  PYTHON
    </text>
  </g>

  <!-- Subtle Cyber Corner Accents -->
  <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />
  <path d="M 1175 45 L 1175 25 L 1155 25" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />
  <path d="M 25 295 L 25 315 L 45 315" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.4" />
  <path d="M 1175 295 L 1175 315 L 1155 315" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.4" />
</svg>
